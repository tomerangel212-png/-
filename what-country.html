const flag=document.querySelector("#flag"),answers=document.querySelector("#answers"),feedback=document.querySelector("#feedback"),progress=document.querySelector("#progress"),scoreEl=document.querySelector("#score"),next=document.querySelector("#next"),restart=document.querySelector("#restart");
let deck=[],index=0,score=0,answered=false;
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const toFlag=code=>code.toUpperCase().replace(/./g,char=>String.fromCodePoint(127397+char.charCodeAt()));
function choicesFor(current){const distractors=shuffle(COUNTRIES.filter(country=>country.code!==current.code)).slice(0,3);return shuffle([current,...distractors]);}
function render(){answered=false;next.hidden=true;feedback.textContent="";answers.innerHTML="";const current=deck[index];progress.textContent=`${index+1} / ${deck.length}`;scoreEl.textContent=`ניקוד: ${score}`;flag.textContent=toFlag(current.code);for(const country of choicesFor(current)){const button=document.createElement("button");button.className="answer";button.type="button";button.textContent=country.name;button.addEventListener("click",()=>answer(button,country,current));answers.appendChild(button);}}
function answer(button,chosen,current){if(answered)return;answered=true;const correct=chosen.code===current.code;if(correct){score+=1;button.classList.add("correct");feedback.textContent="✅ נכון!";}else{button.classList.add("wrong");feedback.textContent=`❌ התשובה הנכונה: ${current.name}`;[...answers.children].find(item=>item.textContent===current.name)?.classList.add("correct");}scoreEl.textContent=`ניקוד: ${score}`;[...answers.children].forEach(item=>item.disabled=true);if(index===deck.length-1){next.textContent="סיום";}else{next.textContent="המדינה הבאה";}next.hidden=false;}
function advance(){if(index<deck.length-1){index+=1;render();return;}answers.innerHTML="";flag.textContent="🏁";feedback.textContent=`סיימתם: ${score} מתוך ${deck.length}`;next.hidden=true;}
function reset(){deck=shuffle(COUNTRIES);index=0;score=0;render();}
next.addEventListener("click",advance);restart.addEventListener("click",reset);reset();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}));}
