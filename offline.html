<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101715">
  <title>TRA · מצב Offline</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#101715;color:#f7f7f2;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:28px;border:1px solid #ffffff24;border-radius:24px;background:#18221f;box-shadow:0 18px 60px #0005;text-align:center}h1{margin:0 0 12px;font-size:clamp(1.8rem,6vw,3rem)}p{line-height:1.65;color:#d9e1dd}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}a,button{min-height:44px;padding:11px 16px;border:1px solid #ffffff30;border-radius:999px;background:#f4cb67;color:#17211e;font:800 1rem system-ui;text-decoration:none;cursor:pointer}a.secondary{background:transparent;color:#fff}
  </style>
</head>
<body>
  <main class="card" id="main-content">
    <h1>📴 אין חיבור כרגע</h1>
    <p>TRA לא החליף את העמוד שביקשת במשחק אחר. עמודים שכבר נשמרו במכשיר ימשיכו לעבוד, וכשהחיבור יחזור אפשר לנסות שוב.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">נסה שוב</button>
      <a class="secondary" href="./">לעמוד הראשי</a>
    </div>
  </main>
  <script src="./tra-quality.js"></script>
</body>
</html>
