<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081922">
<meta name="description" content="TRA HITSTER Mobile Audio — HITSTER 888 עם חוקי כפר בלום ושמע בתוך האתר.">
<title>TRA HITSTER Mobile Audio</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07131d;color:#fff;font-family:Arial,"Noto Sans Hebrew",system-ui,sans-serif}body{overflow:hidden}#game{border:0;width:100%;height:100%;display:block;background:#07131d}.boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;background:#07131d;z-index:2;transition:opacity .2s}.boot.hidden{opacity:0}.boot div{text-align:center;padding:24px}.badge{color:#72e1c3;font-weight:900}.muted{color:#acc2d0;line-height:1.6}
</style>
</head>
<body>
<div id="boot" class="boot"><div><p class="badge">TRA · MOBILE AUDIO · 888</p><h1>🎵 HITSTER</h1><p class="muted">טוען את המשחק. בחירה בין המשך לאיפוס תופיע בתוך HITSTER.</p></div></div>
<iframe id="game" title="HITSTER TRA 888" allow="autoplay"></iframe>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var language=params.get("lang")==="en"?"en":"he";
  var entry=params.get("entry")||"mobile";
  document.documentElement.lang=language;
  document.documentElement.dir=language==="en"?"ltr":"rtl";
  var frame=document.getElementById("game");
  var boot=document.getElementById("boot");
  var target=language==="en"?"hitster-888-en.html":"hitster-888.html";
  frame.src=target+"?entry="+encodeURIComponent(entry);
  frame.addEventListener("load",function(){boot.classList.add("hidden");});
})();
</script>
</body>
</html>
