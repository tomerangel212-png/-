<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRA D&D — גשרים של הבנה</title><style>
:root{--bg:#090d16;--panel:#131a28;--ink:#f7f9ff;--muted:#aeb8ce;--gold:#efc66a;--line:#2c3851;--good:#78e49b;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1b2a45,var(--bg) 48%);color:var(--ink)}main{width:min(1000px,94vw);margin:auto;padding:28px 0 70px}header{text-align:center;padding:35px 0}h1{font-size:clamp(2.6rem,8vw,5.5rem);margin:.1em}.lead{max-width:720px;margin:auto;color:var(--muted);line-height:1.6}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meter{text-align:center}.meter strong{font-size:2rem;display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;border-radius:13px;padding:12px 14px}button{border:0;background:var(--gold);font-weight:900;cursor:pointer}button.alt{background:#24314a;color:white;border:1px solid var(--line)}button.danger{background:#5f2929;color:white}.quest{font-size:1.15rem;line-height:1.6}.result{min-height:75px;color:var(--muted);line-height:1.6}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:.82rem}.win{border-color:var(--good)}footer{text-align:center;color:var(--muted);padding-top:30px}@media(max-width:520px){.meters{grid-template-columns:1fr}.actions button{width:100%}}
</style></head><body><main><header><span class="badge">TRA D&D · VERSION 1.0</span><h1>גשרים של הבנה</h1><p class="lead">הרפתקה שיתופית ל־4–6 משתתפים. המטרה: להשלים חמישה אתגרים דרך הקשבה, שיתוף פעולה וכבוד. אין צורך במנחה חיצוני; המשחק שומר התקדמות במכשיר.</p></header>
<section class="card"><div class="grid"><label>בחרו תפקיד<select id="role"></select></label><div><span class="badge" id="round">אתגר 1/5</span><p id="roleAbility"></p></div></div></section>
<h2>מדדים משותפים</h2><section class="meters"><article class="card meter">אמון<strong id="trust">5</strong></article><article class="card meter">אחדות<strong id="unity">5</strong></article><article class="card meter">אומץ<strong id="courage">5</strong></article></section>
<h2>האתגר</h2><section class="card"><div class="quest" id="quest"></div><div class="actions"><button id="roll">🎲 גלגלו ק20</button><button id="ability" class="alt">הפעל יכולת תפקיד</button><button id="next" class="alt" disabled>האתגר הבא</button><button id="reset" class="danger">איפוס</button></div><div id="result" class="result"></div></section>
<h2>תפקידים</h2><section id="roles" class="grid"></section><footer>© 2026 Tomer Rafael Angel · All Rights Reserved</footer></main>
<script>(()=>{
const KEY='tra-dnd-v1';const roles=[{id:'listener',name:'המקשיב',ability:'פעם במשחק: +2 אמון לפני גלגול.'},{id:'bridge',name:'בונה הגשרים',ability:'פעם במשחק: +2 אחדות לפני גלגול.'},{id:'creator',name:'היוצר',ability:'פעם במשחק: מוסיף +3 לגלגול.'},{id:'leader',name:'המוביל',ability:'פעם במשחק: מגלגל מחדש תוצאה של 1–7.'},{id:'keeper',name:'שומר הערכים',ability:'פעם במשחק: מונע ירידה של מדד אחד.'},{id:'courage',name:'האמיץ',ability:'פעם במשחק: +2 אומץ לפני גלגול.'}];
const quests=['שני צדדים חלוקים לגבי הדרך. כל צד צריך לנסח את הטיעון של הצד השני כך שהצד השני יאשר שהובן נכון.','בחרו זיכרון, שיר או סיפור שמחבר לפחות שני דורות. כל משתתף מוסיף משפט אחד בלי לבטל את הקודם.','הקבוצה מקבלת שלושה צרכים מתנגשים: זמן, שייכות וחופש. נסחו החלטה אחת שנותנת מקום לשלושתם.','אדם אחד מרגיש שלא מקשיבים לו. במשך דקה אחת האחרים יכולים רק לשאול שאלות הבהרה — בלי עצות.','אתגר הסיום: נסחו משפט משותף שמכיל גם מחלוקת אמיתית וגם ערך אחד שעליו כולם מסכימים.'];
const fresh=()=>({round:0,trust:5,unity:5,courage:5,done:0,used:{},rolled:false,abilityArmed:false,prevent:false,bonus:0,last:null});let s=fresh();try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s=x}catch(e){}const $=q=>document.querySelector(q);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function role(){return roles.find(r=>r.id===$('#role').value)||roles[0]}function clamp(){['trust','unity','courage'].forEach(k=>s[k]=Math.max(0,Math.min(10,s[k])))}
function render(){clamp();$('#trust').textContent=s.trust;$('#unity').textContent=s.unity;$('#courage').textContent=s.courage;$('#round').textContent=`אתגר ${Math.min(s.round+1,5)}/5`;$('#quest').textContent=quests[Math.min(s.round,4)];$('#roleAbility').textContent=role().ability;$('#ability').disabled=Boolean(s.used[role().id])||s.rolled;$('#next').disabled=!s.rolled||s.round>=4;$('#roll').disabled=s.rolled||s.round>=5;$('#roles').innerHTML=roles.map(r=>`<article class="card"><strong>${r.name}</strong><p>${r.ability}</p><span class="badge">${s.used[r.id]?'יכולת נוצלה':'יכולת זמינה'}</span></article>`).join('');if(s.round>=5){const avg=(s.trust+s.unity+s.courage)/3;$('#quest').textContent='המסע הסתיים.';$('#result').innerHTML=avg>=5&&s.done>=4?`<strong>🏆 ירוק — המשימה הושלמה.</strong><br>${s.done}/5 אתגרים עברו בהצלחה, ממוצע המדדים ${avg.toFixed(1)}.`:`המסע הסתיים עם ${s.done}/5 הצלחות וממוצע ${avg.toFixed(1)}. נסו שוב כדי להגיע לירוק.`;$('#result').parentElement.classList.toggle('win',avg>=5&&s.done>=4)}save()}
function applyAbility(){const r=role();if(s.used[r.id]||s.rolled)return;s.used[r.id]=true;if(r.id==='listener')s.trust+=2;if(r.id==='bridge')s.unity+=2;if(r.id==='courage')s.courage+=2;if(r.id==='creator')s.bonus=3;if(r.id==='keeper')s.prevent=true;s.abilityArmed=true;$('#result').textContent=`היכולת של ${r.name} הופעלה.`;render()}function roll(){if(s.rolled)return;let d=1+Math.floor(Math.random()*20),r=role();if(r.id==='leader'&&s.used[r.id]&&d<=7)d=1+Math.floor(Math.random()*20);const total=d+s.bonus;s.bonus=0;s.rolled=true;s.last=total;let text;if(total>=15){s.done++;s.trust++;s.unity++;s.courage++;text=`🎲 ${total}: הצלחה מלאה. +1 לכל המדדים.`}else if(total>=8){s.done++;s.trust++;text=`🎲 ${total}: הצלחה חלקית. +1 אמון.`}else{if(!s.prevent){s.trust--;s.unity--}else{s.prevent=false}text=`🎲 ${total}: כישלון. לומדים וממשיכים.`}$('#result').textContent=text;render()}function next(){if(!s.rolled)return;s.round++;s.rolled=false;s.abilityArmed=false;s.prevent=false;s.bonus=0;$('#result').textContent='';render()}
$('#role').innerHTML=roles.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');$('#role').onchange=render;$('#ability').onclick=applyAbility;$('#roll').onclick=roll;$('#next').onclick=next;$('#reset').onclick=()=>{if(confirm('לאפס את המשחק?')){localStorage.removeItem(KEY);s=fresh();$('#result').textContent='';render()}};render();
})();</script></body></html>
