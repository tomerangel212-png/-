name: Deploy Tomer Links

on:
  push:
    branches:
      - main
    paths:
      - 'links/**'
      - 'songs/**'
      - 'poetry/**'
      - 'instrumentals/**'
      - 'tra-dashboard/**'
      - '.github/workflows/tomer-links-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tomer-links-pages
  cancel-in-progress: true

jobs:
  links-quality:
    name: Tomer Links · publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify link-in-bio pages
        run: |
          test -s links/index.html
          test -s songs/index.html
          test -s poetry/index.html
          test -s instrumentals/index.html
          grep -q "posthog.init" links/index.html
          grep -q "tomer_links_page_loaded" links/index.html
          grep -q "tomer_links_card_clicked" links/index.html
          grep -q "../songs/" links/index.html
          grep -q "../poetry/" links/index.html
          grep -q "../instrumentals/" links/index.html

  deploy:
    name: Deploy and verify Tomer Links
    needs: links-quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Tomer Links URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tomerangel212-png.github.io/-/links/"
          ok=0
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -q "Tomer Rafael Angel" <<<"$body" && grep -q "posthog.init" <<<"$body"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Record successful deploy health in PostHog
        shell: bash
        run: |
          curl -fsS --max-time 20 "https://us.i.posthog.com/i/v0/e" \
            -H "Content-Type: application/json" \
            --data-binary '{"api_key":"phc_va9g3UBzamuTv5vAe4PYnbwrDwdxY2d5WboVW7VWtVBE","event":"tomer_links_deploy_verified","distinct_id":"github-actions-tomer-links-health","properties":{"site":"tomer-rafael-angel-links","status":"live","synthetic":true,"url":"https://tomerangel212-png.github.io/-/links/"}}'
