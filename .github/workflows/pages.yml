name: Deploy TRA Sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tra-quality:
    name: TRA · 9.9 · 10/10 release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --input-type=module --check < games-loader.js
          node --check games-hub.js
          node --check hitster-kfar-bloom-2026-demo.js
          node --check build-hitster-hebrew-alist.js
          node --check hitster-888-check.js
          node --check site-smoke-check.js
          node --check tra-games-quality-check.js
          node --check tra-99-quality-check.js
          node --check tra-quality.js
      - name: Build HITSTER 888 Hebrew A-list deck
        run: node build-hitster-hebrew-alist.js
      - name: Enforce HITSTER 888 = 222×4
        run: node hitster-888-check.js
      - name: Run full-site smoke check
        run: node site-smoke-check.js
      - name: Enforce TRA Games quality gate
        run: node tra-games-quality-check.js
      - name: Enforce HITSTER production quality gate
        run: node hitster-quality-check.js
      - name: Enforce HITSTER catalog capacity gate
        run: node hitster-catalog-11111-check.js
      - name: Enforce TRA 9.9 10/10 release gate
        run: node tra-99-quality-check.js

  links-quality:
    name: Tomer Links · publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify link-in-bio pages
        run: |
          test -s links/index.html
          test -s songs/index.html
          test -s poetry/index.html
          test -s instrumentals/index.html
          test -s music-drive.html
          test -s music-editor.html
          grep -q "posthog.init" links/index.html
          grep -q "tomer_links_page_loaded" links/index.html
          grep -q "tomer_links_card_clicked" links/index.html
          grep -q "../songs/" links/index.html
          grep -q "../poetry/" links/index.html
          grep -q "../instrumentals/" links/index.html
          grep -q "../music-drive.html" links/index.html
          grep -q "music-editor.html" games.html

  deploy:
    name: Deploy TRA 9.9 and verify public site
    needs: [tra-quality, links-quality]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build HITSTER 888 deck for artifact
        run: node build-hitster-hebrew-alist.js
      - name: Verify generated deck exists
        run: |
          test -s hitster-hebrew-alist-888.json
          node hitster-888-check.js
          node tra-99-quality-check.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public TRA URLs
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            local needle="$2"
            local ok=0
            for attempt in {1..12}; do
              if body="$(curl -fsSL --max-time 20 "$url" 2>/dev/null)" && grep -q "$needle" <<<"$body"; then
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" -eq 1
          }
          check_url "https://tomerangel212-png.github.io/-/" "THE TRA · 9.9"
          check_url "https://tomerangel212-png.github.io/-/links/" "Tomer Rafael Angel"
          check_url "https://tomerangel212-png.github.io/-/games.html" "מי רוצה להיות עורך מוזיקלי"
          check_url "https://tomerangel212-png.github.io/-/casino-angel.html" "Casino Angel"
          check_url "https://tomerangel212-png.github.io/-/music-drive.html" "נסיעה מוזיקלית"
          check_url "https://tomerangel212-png.github.io/-/music-editor.html" "מי רוצה להיות עורך מוזיקלי"
          check_url "https://tomerangel212-png.github.io/-/hitster.html" "888 קלפי שירים"
          check_url "https://tomerangel212-png.github.io/-/hitster-kfar-bloom-2026-demo.html" "HITSTER TRA"
