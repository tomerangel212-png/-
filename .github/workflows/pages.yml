name: Publish KFAR BLOOM 2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  quality:
    name: TRA · Production release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --check site-smoke-check.js
      - name: Run full-site smoke check
        run: node site-smoke-check.js
      - name: Enforce HITSTER production quality gate
        run: node hitster-quality-check.js
      - name: Enforce HITSTER 11,111 catalog capacity gate
        run: node hitster-catalog-11111-check.js

  publish:
    name: Publish static site to gh-pages branch
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare publish tree
        run: |
          rm -rf .git .github
          touch .nojekyll
      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish $GITHUB_SHA"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
