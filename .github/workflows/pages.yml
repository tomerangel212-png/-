# publish trigger 2026-08-19T10:20+03:00
name: Deploy TRA Sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tra-pages
  cancel-in-progress: true

jobs:
  tra-quality:
    name: TRA · Games + HITSTER quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --check games-hub.js
          node --check hitster-kfar-bloom-2026-demo.js
          node --check build-hitster-hebrew-alist.js
          node --check hitster-888-check.js
          node --check site-smoke-check.js
          node --check tra-games-quality-check.js
      - name: Build HITSTER 888 Hebrew A-list deck
        run: node build-hitster-hebrew-alist.js
      - name: Enforce HITSTER 888 = 222×4
        run: node hitster-888-check.js
      - name: Run full-site smoke check
        run: node site-smoke-check.js
      - name: Enforce TRA Games quality gate
        run: node tra-games-quality-check.js
      - name: Enforce HITSTER production quality gate
        run: node hitster-quality-check.js
      - name: Enforce HITSTER catalog capacity gate
        run: node hitster-catalog-11111-check.js

  links-quality:
    name: Tomer Links · publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify link-in-bio pages
        run: |
          test -s links/index.html
          test -s songs/index.html
          test -s poetry/index.html
          test -s instrumentals/index.html
          grep -q "posthog.init" links/index.html
          grep -q "tomer_links_page_loaded" links/index.html
          grep -q "tomer_links_card_clicked" links/index.html
          grep -q "../songs/" links/index.html
          grep -q "../poetry/" links/index.html
          grep -q "../instrumentals/" links/index.html

  deploy:
    name: Deploy TRA and verify public site
    needs: [tra-quality, links-quality]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build HITSTER 888 deck for artifact
        run: node build-hitster-hebrew-alist.js
      - name: Verify generated deck exists
        run: |
          test -s hitster-hebrew-alist-888.json
          node hitster-888-check.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Tomer Links URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tomerangel212-png.github.io/-/links/"
          ok=0
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -q "Tomer Rafael Angel" <<<"$body" && grep -q "posthog.init" <<<"$body"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Verify public HITSTER 888 hub
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tomerangel212-png.github.io/-/hitster.html"
          ok=0
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -q "888 קלפי שירים" <<<"$body" && ! grep -q "350 הקלפים" <<<"$body" && ! grep -q "444 קלפי" <<<"$body"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Verify public HITSTER 888 game UI
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tomerangel212-png.github.io/-/hitster-kfar-bloom-2026-demo.html"
          ok=0
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -q "888 קלפי שירים" <<<"$body" && grep -q "222 קלפים בכל תקופה" <<<"$body"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
