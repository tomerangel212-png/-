name: Deploy TRA Sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: TRA · Production checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --check games-hub.js
          node --check hitster-kfar-bloom-2026-demo.js
          node --check hitster-444-check.js
          node --check site-smoke-check.js
          node --check tra-games-quality-check.js
      - name: Run full-site smoke check
        run: node site-smoke-check.js
      - name: Enforce TRA Games 100/100 quality gate
        run: node tra-games-quality-check.js
      - name: Enforce HITSTER 444-card deck and New Game reset
        run: node hitster-444-check.js
      - name: Enforce HITSTER production quality gate
        run: node hitster-quality-check.js
      - name: Enforce HITSTER 11,111 catalog capacity gate
        run: node hitster-catalog-11111-check.js

  links-quality:
    name: Tomer Links · publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify link-in-bio pages
        run: |
          test -s links/index.html
          test -s songs/index.html
          test -s poetry/index.html
          test -s instrumentals/index.html
          grep -q "posthog.init" links/index.html
          grep -q "tomer_links_page_loaded" links/index.html
          grep -q "tomer_links_card_clicked" links/index.html
          grep -q "../songs/" links/index.html
          grep -q "../poetry/" links/index.html
          grep -q "../instrumentals/" links/index.html

  deploy:
    name: Deploy and verify Tomer Links
    needs: links-quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Tomer Links URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tomerangel212-png.github.io/-/links/"
          ok=0
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -q "Tomer Rafael Angel" <<<"$body" && grep -q "posthog.init" <<<"$body"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Record successful deploy health in PostHog
        shell: bash
        run: |
          curl -fsS --max-time 20 "https://us.i.posthog.com/i/v0/e/" \
            -H "Content-Type: application/json" \
            --data-binary '{"api_key":"phc_va9g3UBzamuTv5vAe4PYnbwrDwdxY2d5WboVW7VWtVBE","event":"tomer_links_deploy_verified","properties":{"distinct_id":"github-actions-tomer-links-health","site":"tomer-rafael-angel-links","status":"live","synthetic":true,"url":"https://tomerangel212-png.github.io/-/links/"}}'
