name: Deploy TRA Sites to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/live-http.yml", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  tra-quality:
    name: TRA · annual HITSTER release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check hitster-audio-regression.cjs
          node --check hitster-fair-round-regression.cjs
          node --check hitster-original.js
          node --check hitster-888-check.js
          node --check chess-formal-regression.mjs
          node --check site-smoke-check.js
          node --check site-route-integrity-check.js
          node --check tra-games-quality-check.js
          node --check tra-99-quality-check.js
          node --check tra-9999-quality-check.js
          node --check tra-perfect-quality-check.js
          node --check tra-quality.js
          node --check sw.js
      - name: Verify annual 888 deck and TRA quality gates
        run: |
          test -s hitster-alltime-888.json
          test -s hitster-888.html
          test -s hitster-888-en.html
          test -s offline.html
          node chess-formal-regression.mjs
          node hitster-audio-regression.cjs
          node hitster-fair-round-regression.cjs
          node hitster-888-check.js
          node site-smoke-check.js
          node site-route-integrity-check.js
          node tra-games-quality-check.js
          node tra-99-quality-check.js
          node tra-9999-quality-check.js
          node tra-perfect-quality-check.js
      - name: Validate personal HITSTER mode
        run: |
          node --check hitster-personal.js
          node --check hitster-personal-core.js
          node --check build-hitster-world.cjs
          node hitster-personal.test.cjs
      - name: Install browser validation
        run: |
          npm install --prefix "$RUNNER_TEMP/tra-e2e" playwright@1.58.2
          "$RUNNER_TEMP/tra-e2e/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check personal setup in a mobile browser
        run: NODE_PATH="$RUNNER_TEMP/tra-e2e/node_modules" node hitster-personal-browser.cjs
      - name: Upload personal mode preview
        uses: actions/upload-artifact@v7
        with:
          name: hitster-personal-preview
          path: hitster-personal-mobile.png
      - name: Build public country chart snapshot
        run: node build-hitster-world.cjs
      - name: Test public Pages staging
        run: node --test scripts/stage-pages.test.cjs
      - name: Stage public Pages files
        run: node scripts/stage-pages.cjs "$RUNNER_TEMP/tra-pages-public"
      - name: Verify staged public routes and private-file exclusions
        run: |
          node site-route-integrity-check.js "$RUNNER_TEMP/tra-pages-public"
          node scripts/stage-pages.cjs --verify "$RUNNER_TEMP/tra-pages-public"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tra-pages-public
  deploy:
    name: Deploy TRA to GitHub Pages
    needs: tra-quality
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify private documents are unavailable
        run: |
          for path in tra-art-try.html TRA_PRINCIPLES.json TRA-ART-TRY.md; do
            verified=false
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --silent --show-error --output /tmp/tra-privacy-response --write-out '%{http_code}' "https://tomerangel212-png.github.io/-/$path")
              if [ "$status" = "404" ]; then
                echo "$path: HTTP 404"
                verified=true
                break
              fi
              sleep 10
            done
            test "$verified" = true
          done
          curl --fail --silent --show-error 'https://tomerangel212-png.github.io/-/links/' > /tmp/tra-public-links
          if grep -E 'tra-art-try[.]html|TRA_PRINCIPLES[.]json|TRA-ART-TRY[.]md' /tmp/tra-public-links; then
            echo 'Private document navigation remains public'
            exit 1
          fi
          echo 'Public navigation excludes private documents'
