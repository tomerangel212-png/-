name: Deploy TRA Sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  tra-quality:
    name: TRA · annual HITSTER release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check hitster-original.js
          node --check hitster-888-check.js
          node --check site-smoke-check.js
          node --check site-route-integrity-check.js
          node --check tra-games-quality-check.js
          node --check tra-99-quality-check.js
          node --check tra-perfect-quality-check.js
      - name: Verify annual 888 deck
        run: |
          test -s hitster-alltime-888.json
          test -s hitster-888.html
          test -s hitster-888-en.html
          node hitster-888-check.js
          node site-smoke-check.js
          node site-route-integrity-check.js
          node tra-games-quality-check.js
          node tra-99-quality-check.js
          node tra-perfect-quality-check.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
  deploy:
    name: Deploy TRA to GitHub Pages
    needs: tra-quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

