name: TRA Production Quality Checks

on:
  push:
    branches: [main, tra-yellow-to-green, tra-99-99]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: TRA · Production checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check relevant JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --input-type=module --check < games-loader.js
          node --check chess-formal-regression.mjs
          node --check games-hub.js
          node --check music-editor.js
          node --check hitster-original.js
          node --check hitster-888-check.js
          node --check hitster-source-audit.js
          node --check yellow-to-green-check.js
          node --check tra-15-green-check.js
          node --check site-smoke-check.js
          node --check site-route-integrity-check.js
          node --check tra-games-quality-check.js
          node --check hitster-quality-check.js
          node --check hitster-catalog-11111-check.js
          node --check tra-music-station-check.js
          node --check tra-99-quality-check.js
          node --check tra-9999-quality-check.js
          node --check tra-perfect-quality-check.js
          node --check tra-quality.js
          node --check sw.js
      - name: Run executable FIDE chess regression
        run: node chess-formal-regression.mjs
      - name: Enforce annual HITSTER 888 quality gate
        run: node hitster-888-check.js
      - name: Enforce yellow-to-green digital gate
        run: node yellow-to-green-check.js
      - name: Enforce truthful TRA 15/15 green health gate
        run: node tra-15-green-check.js
      - name: Verify Music Editor shares annual HITSTER 888
        run: |
          grep -q "hitster-alltime-888.json" music-editor.js
          grep -q "hitsterCount !== 888" music-editor.js
          grep -q "music-editor.js" music-editor.html
      - name: Verify TRA Music Station 999 unique catalog
        run: node tra-music-station-check.js
      - name: Run full-site smoke check
        run: node site-smoke-check.js
      - name: Verify all site routes and historical pages
        run: node site-route-integrity-check.js
      - name: Enforce TRA Games quality gate
        run: node tra-games-quality-check.js
      - name: Enforce Casino Angel Hold'em quality gate
        run: node casino-angel-quality-check.js
      - name: Enforce existing HITSTER catalog capacity gate
        run: node hitster-catalog-11111-check.js
      - name: Enforce TRA 9.9 release gate
        run: node tra-99-quality-check.js
      - name: Enforce TRA 99.99 operational quality gate
        run: node tra-9999-quality-check.js
      - name: Enforce TRA target contract
        run: node tra-perfect-quality-check.js
