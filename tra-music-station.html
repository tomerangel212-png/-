<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102436"><title>TRA Station · 444</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",system-ui,sans-serif;background:#07131d;color:#f7fbff;--panel:#102435;--line:#29485e;--gold:#f4cb67;--mint:#72e1c3;--muted:#a9bfce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173c4a,#07131d 48%);min-height:100vh}.app{width:min(900px,100%);margin:auto;padding:20px 16px 52px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:clamp(2rem,8vw,4rem);margin:.2em 0}.hero p{color:var(--muted);line-height:1.5}.count{display:inline-flex;margin-top:10px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-weight:900}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter,.action{font:inherit;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#0a1a27;color:#fff;font-weight:800}.filter.active,.action.primary{background:var(--mint);color:#062119;border-color:transparent}.station-card{text-align:center;min-height:330px;display:grid;place-items:center}.year{font-size:1rem;color:var(--gold);font-weight:900}.title{font-size:clamp(1.7rem,6vw,2.8rem);font-weight:950;margin:8px 0}.artist{color:var(--mint);font-size:1.2rem}.meta{color:var(--muted);margin-top:8px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}.action{border-radius:13px;cursor:pointer}.action.gold{background:var(--gold);color:#261d06;border-color:transparent}.action:disabled{opacity:.45;cursor:not-allowed}.status{min-height:1.4em;color:var(--muted);margin-top:12px}.quality{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#0a1a27;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.metric strong{display:block;color:var(--mint);font-size:1.3rem}.queue{display:grid;gap:8px}.queue-row{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #ffffff12;padding:10px 0}.queue-row:last-child{border-bottom:0}.queue-row small{color:var(--muted)}.apple{color:#fff;text-decoration:none;font-weight:900}.back{display:block;text-align:center;color:#dce7ec;margin-top:18px;text-decoration:none;font-weight:900}@media(max-width:600px){.queue-row{grid-template-columns:52px 1fr}.queue-row .apple{grid-column:2}.quality{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app">
<section class="hero"><div style="color:var(--gold);font-weight:900">THE TRA · MUSIC STATION</div><h1>📻 TRA Station</h1><p>ישראלי · פופ · רוק · אמריקאי · בריטי<br>כל שיר מאומת מול Apple Music בזמן הבחירה; התאמה לא בטוחה נדחית ולא מתנגנת.</p><span class="count" id="count">טוען 444…</span></section>
<section class="panel"><div class="filters" id="filters"></div></section>
<section class="panel station-card"><div><div class="year" id="year">טוען תחנה…</div><div class="title" id="title"></div><div class="artist" id="artist"></div><div class="meta" id="meta"></div><div class="actions"><button class="action primary" id="next">▶ שיר הבא</button><button class="action gold" id="preview" disabled>30 שניות</button><a class="action apple" id="open-apple" target="_blank" rel="noopener noreferrer"> Music</a></div><div class="status" id="status"></div><audio id="audio" preload="metadata" playsinline></audio></div></section>
<section class="panel"><h2>444 · חלוקה</h2><div class="quality"><div class="metric"><strong>148</strong>ישראלי</div><div class="metric"><strong>148</strong>אמריקאי</div><div class="metric"><strong>148</strong>בריטי</div><div class="metric"><strong>444</strong>סה״כ</div></div></section>
<section class="panel"><h2>התור בתחנה</h2><div class="queue" id="queue"></div></section>
<a class="back" href="games.html#all-games">← חזרה ל־TRA GAMES</a>
</main>
<script>
"use strict";
const FILTERS=["הכל","ישראלי","פופ","רוק","אמריקאי","בריטי"];
const $=id=>document.getElementById(id);
let payload=null,tracks=[],active="הכל",used=new Set(),rejected=new Set(),current=null,previewTimer=null;
const norm=s=>String(s||"").normalize("NFKD").toLowerCase().replace(/[\u0591-\u05c7]/g,"").replace(/&/g," and ").replace(/[^\p{L}\p{N}]+/gu," ").trim().replace(/\s+/g," ");
const baseTitle=s=>norm(String(s||"").replace(/\([^)]*\)|\[[^\]]*\]/g," ").replace(/\b(remaster(?:ed)?|live|mix|version|edit)\b/gi," "));
const key=t=>`${norm(t.artist)}|${norm(t.title)}`;
function expand(data){const out=[];for(const [region,groups] of Object.entries(data.groups||{})){for(const group of groups){for(const title of group.songs||[]){out.push({title,artist:group.artist,region,genres:[...(group.genres||[])]});}}}return out;}
function filtered(){return active==="הכל"?tracks:tracks.filter(t=>t.genres.includes(active));}
function regionIcon(r){return r==="IL"?"🇮🇱":r==="US"?"🇺🇸":"🇬🇧";}
function searchUrl(t){return `https://music.apple.com/il/search?term=${encodeURIComponent(`${t.artist} ${t.title}`)}`;}
function renderFilters(){const host=$("filters");host.replaceChildren();FILTERS.forEach(f=>{const b=document.createElement("button");b.className=`filter${f===active?" active":""}`;b.textContent=f;b.onclick=()=>{active=f;used.clear();rejected.clear();renderFilters();renderQueue();draw();};host.append(b);});}
function renderQueue(){const host=$("queue");host.replaceChildren();const pool=filtered();const sample=[...pool].sort(()=>Math.random()-.5).slice(0,12);sample.forEach(t=>{const row=document.createElement("div");row.className="queue-row";const y=document.createElement("strong");y.textContent=regionIcon(t.region);const mid=document.createElement("div");const name=document.createElement("strong");name.textContent=t.title;const br=document.createElement("br");const small=document.createElement("small");small.textContent=`${t.artist} · ${t.genres.join(" · ")}`;mid.append(name,br,small);const a=document.createElement("a");a.className="apple";a.target="_blank";a.rel="noopener noreferrer";a.href=searchUrl(t);a.textContent="";row.append(y,mid,a);host.append(row);});}
function stop(){clearTimeout(previewTimer);previewTimer=null;const a=$("audio");a.pause();try{a.currentTime=0}catch{}$("preview").textContent="30 שניות";}
function scoreCandidate(t,x){const a=norm(t.artist),xa=norm(x.artistName),tt=norm(t.title),xt=norm(x.trackName),bt=baseTitle(t.title),bxt=baseTitle(x.trackName);let artist=xa===a?4:(xa.includes(a)||a.includes(xa)?2:0);let title=xt===tt?5:(bxt===bt?4:(bxt.startsWith(bt)||bt.startsWith(bxt)?2:0));if(/karaoke|tribute|cover/i.test(String(x.collectionName||"")+" "+String(x.artistName||"")))return -99;return artist+title;}
async function searchCountry(t,country){const q=encodeURIComponent(`${t.artist} ${t.title}`);const r=await fetch(`https://itunes.apple.com/search?term=${q}&country=${country}&media=music&entity=song&limit=20`);if(!r.ok)return null;const j=await r.json();const ranked=(j.results||[]).map(x=>({x,s:scoreCandidate(t,x)})).sort((a,b)=>b.s-a.s);return ranked[0]?.s>=6?ranked[0].x:null;}
async function resolveApple(t){const countries=t.region==="IL"?["IL"]:t.region==="US"?["IL","US"]:["IL","GB"];for(const c of countries){const hit=await searchCountry(t,c).catch(()=>null);if(hit)return hit;}return null;}
async function draw(attempt=0){stop();const pool=filtered();if(!pool.length){$("status").textContent="אין שירים במסנן הזה.";return;}let avail=pool.filter(t=>!used.has(key(t))&&!rejected.has(key(t)));if(!avail.length){used.clear();rejected.clear();avail=pool;}const t=avail[Math.floor(Math.random()*avail.length)];current=t;$("year").textContent=`${regionIcon(t.region)} מאמת מול Apple Music…`;$("title").textContent=t.title;$("artist").textContent=t.artist;$("meta").textContent=t.genres.join(" · ");$("open-apple").href=searchUrl(t);$("status").textContent="בודק התאמת שם שיר + אמן…";$("preview").disabled=true;const hit=await resolveApple(t);if(current!==t)return;if(!hit){rejected.add(key(t));if(attempt<12){$("status").textContent="ההתאמה לא הייתה בטוחה — מדלג לשיר הבא.";return draw(attempt+1);}$("status").textContent="לא נמצאה כרגע התאמה בטוחה ב־Apple Music.";return;}used.add(key(t));const year=String(hit.releaseDate||"").slice(0,4)||"—";$("year").textContent=`${year} · ${regionIcon(t.region)} · ✓ Apple Music`;
$("title").textContent=hit.trackName;$("artist").textContent=hit.artistName;$("meta").textContent=t.genres.join(" · ");$("open-apple").href=hit.trackViewUrl||searchUrl(t);if(hit.previewUrl){$("audio").src=hit.previewUrl;$("preview").disabled=false;$("status").textContent="✓ שם שיר ואמן תואמים · Preview מוכן.";}else{$("audio").removeAttribute("src");$("status").textContent="✓ שם שיר ואמן תואמים · אין Preview זמין; פתחו ב־Apple Music.";}}
function play(){const a=$("audio");if(!a.src)return;if(!a.paused){stop();return;}a.currentTime=0;Promise.resolve(a.play()).then(()=>{$("preview").textContent="■ עצירה";$("status").textContent="▶ מנגן עד 30 שניות";previewTimer=setTimeout(stop,30000);}).catch(()=>{$("status").textContent="Safari חסם נגינה; לחצו שוב על 30 שניות.";});}
async function init(){const r=await fetch("./tra-music-station.json",{cache:"no-store"});if(!r.ok)throw new Error("מאגר התחנה לא נטען");payload=await r.json();tracks=expand(payload);if(tracks.length!==444)throw new Error(`מאגר לא תקין: ${tracks.length}/444`);$("count").textContent=`444 שירים · 148 ישראלי · 148 אמריקאי · 148 בריטי`;renderFilters();renderQueue();$("next").onclick=()=>draw();$("preview").onclick=play;await draw();}
init().catch(e=>{$("status").textContent=String(e.message||e);});
</script></body></html>
