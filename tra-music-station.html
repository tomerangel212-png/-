<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102436"><title>TRA Station</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",system-ui,sans-serif;background:#07131d;color:#f7fbff;--panel:#102435;--line:#29485e;--gold:#f4cb67;--mint:#72e1c3;--muted:#a9bfce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173c4a,#07131d 48%);min-height:100vh}.app{width:min(900px,100%);margin:auto;padding:20px 16px 52px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:clamp(2rem,8vw,4rem);margin:.2em 0}.hero p{color:var(--muted);line-height:1.5}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter,.action{font:inherit;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#0a1a27;color:#fff;font-weight:800}.filter.active,.action.primary{background:var(--mint);color:#062119;border-color:transparent}.station-card{text-align:center;min-height:330px;display:grid;place-items:center}.year{font-size:1rem;color:var(--gold);font-weight:900}.title{font-size:clamp(1.7rem,6vw,2.8rem);font-weight:950;margin:8px 0}.artist{color:var(--mint);font-size:1.2rem}.meta{color:var(--muted);margin-top:8px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}.action{border-radius:13px;cursor:pointer}.action.gold{background:var(--gold);color:#261d06;border-color:transparent}.action:disabled{opacity:.45;cursor:not-allowed}.status{min-height:1.4em;color:var(--muted);margin-top:12px}.queue{display:grid;gap:8px}.queue-row{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #ffffff12;padding:10px 0}.queue-row:last-child{border-bottom:0}.queue-row small{color:var(--muted)}.apple{color:#fff;text-decoration:none;font-weight:900}.back{display:block;text-align:center;color:#dce7ec;margin-top:18px;text-decoration:none;font-weight:900}@media(max-width:600px){.queue-row{grid-template-columns:52px 1fr}.queue-row .apple{grid-column:2}}
</style>
</head>
<body><main class="app">
<section class="hero"><div style="color:var(--gold);font-weight:900">THE TRA · MUSIC STATION</div><h1>📻 TRA Station</h1><p>ישראלי · פופ · רוק · אמריקאי · בריטי<br>שירים מאומתים מול Apple Music, עם ערבוב חכם ו־Preview כאשר זמין.</p></section>
<section class="panel"><div class="filters" id="filters"></div></section>
<section class="panel station-card"><div><div class="year" id="year">טוען תחנה…</div><div class="title" id="title"></div><div class="artist" id="artist"></div><div class="meta" id="meta"></div><div class="actions"><button class="action primary" id="next">▶ שיר הבא</button><button class="action gold" id="preview" disabled>30 שניות</button><a class="action apple" id="open-apple" target="_blank" rel="noopener noreferrer"> Music</a></div><div class="status" id="status"></div><audio id="audio" preload="metadata" playsinline></audio></div></section>
<section class="panel"><h2>התור בתחנה</h2><div class="queue" id="queue"></div></section>
<a class="back" href="games.html#all-games">← חזרה ל־TRA GAMES</a>
</main>
<script>
"use strict";
const FILTERS=["הכל","ישראלי","פופ","רוק","אמריקאי","בריטי"];
const $=id=>document.getElementById(id);
let payload={tracks:[]},active="הכל",used=new Set(),current=null,previewTimer=null;
const norm=s=>String(s||"").normalize("NFKC").trim().toLowerCase();
const key=t=>`${norm(t.title)}|${norm(t.artist)}|${t.year}`;
function filtered(){return active==="הכל"?payload.tracks:payload.tracks.filter(t=>t.genres.includes(active));}
function renderFilters(){const host=$("filters");host.replaceChildren();FILTERS.forEach(f=>{const b=document.createElement("button");b.className=`filter${f===active?" active":""}`;b.textContent=f;b.onclick=()=>{active=f;used.clear();renderFilters();renderQueue();draw();};host.append(b);});}
function renderQueue(){const host=$("queue");host.replaceChildren();filtered().slice(0,12).forEach(t=>{const row=document.createElement("div");row.className="queue-row";const y=document.createElement("strong");y.textContent=t.year;const mid=document.createElement("div");mid.innerHTML=`<strong>${t.title}</strong><br><small>${t.artist} · ${t.genres.join(" · ")}</small>`;const a=document.createElement("a");a.className="apple";a.target="_blank";a.rel="noopener noreferrer";a.href=`https://music.apple.com/il/song/${encodeURIComponent(t.appleMusicId)}`;a.textContent="";row.append(y,mid,a);host.append(row);});}
function stop(){clearTimeout(previewTimer);previewTimer=null;const a=$("audio");a.pause();try{a.currentTime=0}catch{}$("preview").textContent="30 שניות";}
async function resolvePreview(t){const r=await fetch(`https://itunes.apple.com/lookup?id=${encodeURIComponent(t.appleMusicId)}&country=IL&entity=song`);if(!r.ok)return null;const j=await r.json();return (j.results||[]).find(x=>x.wrapperType==="track")?.previewUrl||null;}
async function draw(){stop();const pool=filtered();if(!pool.length){$("status").textContent="אין שירים במסנן הזה.";return;}let avail=pool.filter(t=>!used.has(key(t)));if(!avail.length){used.clear();avail=pool;}const t=avail[Math.floor(Math.random()*avail.length)];used.add(key(t));current=t;$("year").textContent=t.year;$("title").textContent=t.title;$("artist").textContent=t.artist;$("meta").textContent=t.genres.join(" · ");$("open-apple").href=`https://music.apple.com/il/song/${encodeURIComponent(t.appleMusicId)}`;$("status").textContent="מחפש Preview…";$("preview").disabled=true;const url=await resolvePreview(t).catch(()=>null);if(current!==t)return;t.preview=url;if(url){$("audio").src=url;$("preview").disabled=false;$("status").textContent="מוכן לנגינה.";}else{$("audio").removeAttribute("src");$("status").textContent="אין Preview זמין; פתחו ב־Apple Music.";}}
function play(){if(!current?.preview)return;const a=$("audio");if(!a.paused){stop();return;}a.currentTime=0;Promise.resolve(a.play()).then(()=>{$("preview").textContent="■ עצירה";$("status").textContent="▶ מנגן 30 שניות";previewTimer=setTimeout(stop,30000);}).catch(()=>{$("status").textContent="Safari חסם נגינה אוטומטית; נסו שוב.";});}
async function init(){const r=await fetch("./tra-music-station.json",{cache:"no-store"});if(!r.ok)throw new Error("מאגר התחנה לא נטען");payload=await r.json();renderFilters();renderQueue();$("next").onclick=draw;$("preview").onclick=play;await draw();}
init().catch(e=>{$("status").textContent=String(e.message||e);});
</script></body></html>
